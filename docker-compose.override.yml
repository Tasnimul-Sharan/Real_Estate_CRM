# Office configuration: both this PC and the existing office LAN URL.
# Copied to docker-compose.override.yml so plain docker compose up uses it too.
services:
  api:
    environment:
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://192.168.10.28:3000
    ports: !override
      - "127.0.0.1:4000:4000"
      - "192.168.10.28:4000:4000"
  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://192.168.10.28:4000/api
    ports: !override
      - "127.0.0.1:3000:3000"
      - "192.168.10.28:3000:3000"
