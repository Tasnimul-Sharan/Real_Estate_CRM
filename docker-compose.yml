name: real_estate_crm_nestjs_complete
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: realestate_crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/Initialize-Security.ps1 first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d realestate_crm"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://crm_user:${POSTGRES_PASSWORD}@db:5432/realestate_crm?schema=public
      JWT_SECRET: ${JWT_SECRET:?Run scripts/Initialize-Security.ps1 first}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: crm_user
      PGDATABASE: realestate_crm
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run scripts/Initialize-Security.ps1 first}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
